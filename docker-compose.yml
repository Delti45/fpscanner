# Środowisko deweloperskie: nginx (TLS 1.3 + mTLS) -> API (FastAPI) -> PostgreSQL + Vault Transit.
#
#   docker compose up -d --build                  # provision -> postgres/vault -> api -> proxy
#   docker compose --profile test run --rm smoke  # test dymny przez nginx
#   docker compose down -v                        # kasuje też wolumeny (klucze, baza)
#
# UWAGA: klucze, certyfikaty i rejestr urządzeń powstają w wolumenie `fp-data` i są
# deweloperskie. Vault działa w trybie `-dev` (pamięć, token roota, HTTP): po jego restarcie
# klucz główny (KEK) znika i zaszyfrowane rekordy w PostgreSQL stają się nieodczytywalne,
# więc restartując Vaulta, zacznij od `docker compose down -v`.
# Na produkcji PKI, KEK i sekrety urządzeń pochodzą z własnych systemów.

name: fpscanner

x-app: &app
  image: fpscanner:dev
  build: .

services:
  provision:
    <<: *app
    # jednorazowo: gdy /data/server.env już jest, nic nie robi (klucze przeżywają restart)
    command:
      - sh
      - -c
      - >-
        test -f /data/server.env ||
        fp-provision-dev --out /data --readers reader-01 --admins admin-01
        --behind-proxy
        --proxy-host 0.0.0.0 --proxy-port 8443
        --upstream-host api --app-port 8000
        --server-name localhost --server-name proxy
        --trusted-proxy 172.28.0.10
        --nginx-error-log /dev/stderr
    volumes: [fp-data:/data]
    networks: [fpnet]
    restart: "no"

  api:
    <<: *app
    depends_on:
      provision: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      vault-init: {condition: service_completed_successfully}
    command: ["fp-server"]
    environment:
      FP_HOST: 0.0.0.0
      FP_LOG_LEVEL: INFO
      # zmienne z compose mają pierwszeństwo przed /data/server.env (patrz docker/entrypoint.sh)
      FP_DATABASE_URL: postgresql://fp:${FP_PG_PASSWORD:-fp-dev-only-change-me}@postgres:5432/fp
      FP_KEY_PROVIDER: vault
      FP_VAULT_ADDR: http://vault:8200
      FP_VAULT_ALLOW_HTTP: "1"                    # tylko dev: produkcja wymaga https i FP_VAULT_CACERT
      FP_VAULT_TOKEN: ${FP_VAULT_TOKEN:-fp-dev-root-token}
      FP_VAULT_KEY: fp-kek
    volumes: [fp-data:/data]
    networks: [fpnet]               # bez `ports:` – dostępne tylko dla proxy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      api: {condition: service_healthy}
    # nginx.conf wygenerował `provision` (certyfikaty i upstream `api:8000` są w wolumenie)
    command: ["nginx", "-c", "/data/nginx.conf", "-p", "/data/run", "-g", "daemon off;"]
    volumes: [fp-data:/data]
    ports:
      - "127.0.0.1:${FP_PROXY_PORT:-8443}:8443"     # tylko loopback hosta
    networks:
      fpnet:
        ipv4_address: 172.28.0.10                   # jedyny zaufany adres proxy dla aplikacji
    restart: unless-stopped

  smoke:
    <<: *app
    profiles: [test]
    depends_on: [proxy]
    command: >-
      python -m fpscanner.tools.smoke_test --url https://proxy:8443
      --client /data/clients/reader-01.json --admin /data/clients/admin-01.json --wait 20
    volumes: [fp-data:/data:ro]
    networks: [fpnet]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fp
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: ${FP_PG_PASSWORD:-fp-dev-only-change-me}
    volumes: [pg-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp -d fp"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [fpnet]

  vault:
    image: hashicorp/vault:1.18
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${FP_VAULT_TOKEN:-fp-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports: ["127.0.0.1:8200:8200"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [fpnet]

  vault-init:                       # włącza silnik Transit i tworzy klucz główny (KEK)
    image: hashicorp/vault:1.18
    depends_on:
      vault: {condition: service_healthy}
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${FP_VAULT_TOKEN:-fp-dev-root-token}
    entrypoint: ["sh", "-c"]
    command:
      - vault secrets enable transit || true; vault write -f transit/keys/fp-kek type=aes256-gcm96 derived=true
    networks: [fpnet]
    restart: "no"

networks:
  fpnet:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  fp-data:
  pg-data:
