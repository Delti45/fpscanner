name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci        # więcej przykładów w testach własności
      FP_TEST_PG_DSN: postgresql://fp:fp@127.0.0.1:5432/fp      # test kontraktowy PostgresTemplateRepository
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: fp, POSTGRES_USER: fp, POSTGRES_PASSWORD: fp}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fp -d fp" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: nginx (test integracyjny proxy)
        run: sudo apt-get update && sudo apt-get install -y nginx-light
      - run: pip install -e ".[dev,postgres,xcheck]"
      - run: pytest -q

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Budowa obrazu i uruchomienie stosu
        run: docker compose up -d --build
      - name: Test dymny przez nginx (mTLS)
        run: docker compose --profile test run --rm smoke
      - name: Logi (przy błędzie)
        if: failure()
        run: docker compose logs --no-color
      - name: Sprzątanie
        if: always()
        run: docker compose down -v
