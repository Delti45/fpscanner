# Wygenerowano przez fpscanner.tools.nginx_conf (nie edytuj ręcznie, zmień generator).
# Fragment kontekstu `http`: zapisz jako /etc/nginx/conf.d/fp.conf (dołączany z nginx.conf).
log_format fp '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=fp_api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name fp.example.com;
    server_tokens off;
    access_log /var/log/nginx/fp_access.log fp;

    ssl_certificate         /etc/fp/tls/server.pem;
    ssl_certificate_key     /etc/fp/tls/server.key;
    ssl_protocols           TLSv1.3;
    ssl_session_tickets     off;

    # mTLS: certyfikat klienta musi pochodzić z naszego CA
    ssl_client_certificate  /etc/fp/tls/client-ca.pem;
    ssl_verify_client       on;
    ssl_verify_depth        1;

    client_max_body_size    64k;
    client_header_timeout   10s;
    client_body_timeout     10s;
    keepalive_timeout       30s;

    location /v1/ {
        limit_except POST { deny all; }
        limit_req zone=fp_api burst=60 nodelay;

        proxy_pass              http://127.0.0.1:8000;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        # NADPISUJEMY (nie dopisujemy): nginx jest brzegiem sieci
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header        X-Client-Cert-Verify $ssl_client_verify;
        proxy_connect_timeout   3s;
        proxy_send_timeout      15s;
        proxy_read_timeout      15s;
    }

    location / { return 404; }
}
